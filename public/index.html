<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT Help Desk</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header py-4 mb-4">
      <div class="container">
        <h1 class="h2 mb-1">QuickDesk Ticket Tracker</h1>
        <p class="mb-0">Report an IT problem and follow its progress.</p>
      </div>
    </header>

    <main class="container pb-5">
      <div
        id="message"
        class="visually-hidden"
        role="status"
        aria-live="polite"
      ></div>
      <div class="row g-4">
        <section class="col-lg-5" aria-labelledby="form-heading">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <h2 id="form-heading" class="h4 mb-3">Create a ticket</h2>
              <form id="ticketForm">
                <div class="mb-3">
                  <label for="requesterName" class="form-label"
                    >Your name</label
                  >
                  <input
                    id="requesterName"
                    name="requesterName"
                    class="form-control"
                    type="text"
                    minlength="2"
                    maxlength="40"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="title" class="form-label">Problem title</label>
                  <input
                    id="title"
                    name="title"
                    class="form-control"
                    type="text"
                    minlength="5"
                    maxlength="80"
                    placeholder="Example: Wi-Fi keeps disconnecting"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="category" class="form-label">Category</label>
                  <select
                    id="category"
                    name="category"
                    class="form-select"
                    required
                  >
                    <option value="">Choose a category</option>
                    <option>Hardware</option>
                    <option>Software</option>
                    <option>Network</option>
                    <option>Account</option>
                    <option>Other</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="description" class="form-label"
                    >What happened?</label
                  >
                  <textarea
                    id="description"
                    name="description"
                    class="form-control"
                    rows="5"
                    minlength="10"
                    maxlength="500"
                    required
                  >
                  </textarea>
                  <div class="form-text">
                    Include what you tried and any error message.
                  </div>
                </div>
                <button class="btn btn-primary w-100" type="submit">
                  Save ticket
                </button>
              </form>
            </div>
          </div>
        </section>

        <section class="col-lg-7" aria-labelledby="list-heading">
          <div
            class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"
          >
            <div>
              <h2 id="list-heading" class="h4 mb-1">Tickets</h2>
              <p id="ticketCount" class="text-secondary mb-0">0 tickets</p>
            </div>
            <button
              id="clearButton"
              class="btn btn-outline-danger btn-sm"
              type="button"
            >
              Clear Tickets
            </button>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-sm-6">
              <label for="statusFilter" class="form-label small"
                >Filter by status</label
              >
              <select id="statusFilter" class="form-select">
                <option value="All">All statuses</option>
                <option>Open</option>
                <option>Working</option>
                <option>Done</option>
              </select>
            </div>
            <div class="col-sm-6">
              <label for="categoryFilter" class="form-label small"
                >Filter by category</label
              >
              <select id="categoryFilter" class="form-select">
                <option value="All">All categories</option>
                <option>Hardware</option>
                <option>Software</option>
                <option>Network</option>
                <option>Account</option>
                <option>Other</option>
              </select>
            </div>
          </div>

          <div id="emptyState" class="empty-state text-center p-5 rounded-3">
            <h3 class="h5">No tickets to show</h3>
            <p class="text-secondary mb-0">
              Create a ticket or change the filters.
            </p>
          </div>

          <div id="ticketList" class="vstack gap-3"></div>
        </section>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
